# Giftwell thank-you survey: asks "How did you hear about us?" after purchase and
# sends the answer to the Giftwell app (app/routes/api.survey.tsx).
api_version = "2026-10"

[[extensions]]
name = "t:name"
handle = "thank-you-survey"
type = "ui_extension"
uid = "36589f62-9892-39cb-2f34-f27a46d18b634b74a298"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
api_access = false
# Sends the answer to the app server. Approved in the Dev Dashboard
# (Settings → Access requests → Network access).
network_access = true
