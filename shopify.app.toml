# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b65f348e90bb00d9c4d9b25cbc8da6e6"
application_url = "https://example.com"
embedded = true
name = "Giftwell"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_discounts: create the automatic discount that runs the tiered-discount Function
# write_orders: required to define the order metafield that stores the gift message
# write_payment_customizations: activate the hide-cod payment customization Function
# write_validations: activate the max-per-product validation Function
# write_products, write_publications: create and publish the "Gift wrap" product for the upsell
# write_checkout_branding_settings: demo setup only, brands the dev store checkout (docs/checkout-branding.graphql)
scopes = "write_discounts,write_orders,write_payment_customizations,write_validations,write_products,write_publications,write_checkout_branding_settings"

# Gift message: the checkout extension writes the cart metafield $app.gift_message,
# and this definition copies it onto the order and shows it to the merchant.
[order.metafields.app.gift_message]
name = "Gift message"
description = "Message the buyer wrote in checkout, added by Giftwell"
type = "multi_line_text_field"
capabilities.cart_to_order_copyable = true

  [order.metafields.app.gift_message.access]
  admin = "merchant_read"

[webhooks]
api_version = "2027-01"
# The template's app/uninstalled and app/scopes_update subscriptions are removed while
# developing with `shopify app dev --use-localhost`: Shopify can't deliver webhooks to
# localhost and rejects the config. Their route handlers stay in app/routes/ and get
# re-subscribed here before deploying to a public URL.

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
